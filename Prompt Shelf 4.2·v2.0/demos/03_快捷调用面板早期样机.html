<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Prompt Shelf · V1 交互验收样机</title>
<style>
:root{--bg:#e9edf3;--panel:#f8f9fb;--ink:#293345;--muted:#8b94a4;--line:#e4e7ed;--blue:#245bff;--soft:#f3f5f9}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:13px/1.48 "Microsoft YaHei",Inter,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #245bff;outline-offset:2px}
.shell{min-height:100vh;position:relative;overflow:hidden}.workspace{min-height:100vh;background:radial-gradient(ellipse at 60% 10%,#fff 0,#f2f4f8 60%,#e8edf5 100%);display:flex;justify-content:flex-end;padding:48px min(7vw,130px)}.target{width:min(430px,100%);align-self:flex-end;margin-bottom:8vh}.target h2{margin:0 0 13px;font-size:20px;font-weight:650;letter-spacing:-.6px}.target p{color:#8590a2;font-size:12px}.editor{background:white;border:1px solid #dfe4eb;border-radius:17px;box-shadow:0 12px 35px #293c5a12;padding:15px;min-height:165px}.editor-title{font-size:11px;color:#9099a8;letter-spacing:.4px;margin-bottom:11px}.editor-content{max-height:240px;overflow:auto;line-height:1.7;min-height:68px}.insert{display:flex;gap:7px;align-items:flex-start;border-top:1px solid #edf0f4;padding:8px 0;font-size:12px;word-break:break-word}.insert:first-child{border-top:0}.insert b{flex:none;color:#315ec6;font-size:11px;max-width:60px}.empty{color:#a9b2bf;font-size:12px}.target-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:#8e99a8;font-size:11px}.target-actions button{border:1px solid #e4e9f1;padding:5px 9px;border-radius:7px;background:white;color:#7b8494}
.panel{position:absolute;top:30px;left:36px;bottom:30px;width:min(820px,calc(100vw - 72px));background:var(--panel);border:1px solid #d5dce7;border-radius:15px;box-shadow:0 18px 70px #2f45632e;display:flex;flex-direction:column;overflow:hidden;z-index:3}.panel.is-hidden{display:none}.bar{height:44px;flex:none;padding:0 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:#fafbfc}.logo{width:24px;height:24px;display:grid;place-items:center;background:#245bff;color:#fff;border-radius:7px;font-size:15px;font-weight:600}.brand{font-size:14px;font-weight:720;letter-spacing:-.25px}.bar small{color:#a0a8b5;font-size:10px}.bar-end{margin-left:auto;color:#9ba4b2;display:flex;align-items:center;gap:10px}.bar-end kbd{padding:3px 6px;border:1px solid #e1e5eb;border-radius:5px;font-size:10px;background:white;font-family:inherit}.x{border:0;background:transparent;color:#8e99a8;font-size:20px;line-height:1;padding:2px 5px}.controls{padding:12px 14px 9px;flex:none;background:#fafbfc}.search-wrap{height:38px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#fff;border:1px solid #e1e5ed;border-radius:9px;box-shadow:0 1px 3px #22334404}.mag{font-size:19px;color:#97a2b2;line-height:1}.search-wrap:focus-within{border-color:#99b3ff;box-shadow:0 0 0 2px #245bff0d}.search-wrap input{flex:1;border:0;outline:0;background:transparent;min-width:40px;color:#293345;font-size:12px}.search-wrap input::placeholder{color:#abb3be}.clear{border:0;background:transparent;color:#a6afbc;font-size:17px;padding:0 2px}.nav{display:flex;align-items:center;gap:6px;margin-top:11px;overflow:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.tab,.category{white-space:nowrap;flex:none;border:1px solid #e4e8ef;color:#647086;background:#fff;border-radius:7px;font-size:11px;padding:5px 10px}.tab.active,.category.active{color:white;background:#33435f;border-color:#33435f}.nav .line{height:17px;width:1px;background:#e0e4e9;flex:none;margin:0 4px}.count{margin-left:auto;white-space:nowrap;color:#99a3b1;font-size:10px;padding-left:8px}.list{flex:1;overflow-y:auto;padding:4px 14px 14px;scrollbar-color:#d5dce7 transparent;scrollbar-width:thin}.case{background:#fff;border:1px solid #e1e6ee;border-radius:11px;padding:11px 12px 10px;margin:8px 0;box-shadow:0 1px 5px #1d2b4208;transition:border-color .12s}.case.selected{border-color:#b4c6ee}.casehead{display:flex;align-items:center;gap:7px;min-height:22px;white-space:nowrap;overflow:hidden}.title{font-size:12.5px;line-height:1.5;font-weight:720;overflow:hidden;text-overflow:ellipsis;flex:none;max-width:32%}.project{font-size:10.5px;color:#8994a5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:35px;max-width:23%}.tag{flex:none;background:#f2f5f9;border:1px solid #edf0f5;border-radius:5px;padding:2px 6px;color:#66768e;font-size:10px}.star{margin-left:auto;flex:none;background:none;border:none;color:#c1c8d4;font-size:17px;line-height:1;padding:2px}.star.on{color:#e5a72b}.imgline{display:flex;align-items:center;gap:8px;height:90px;max-width:100%;margin-top:7px;min-width:0}.photo{height:90px;flex:none;position:relative;border-radius:6px;overflow:hidden;border:1px solid #e0e4eb;background:#e7eaf0;padding:0;display:block}.photo.result{width:90px;border-color:#cdd5e2}.photo.placeholder{border:1px dashed #d7dfeb;background:#f6f7f9;color:#b7c0cc}.photo:hover{border-color:#638cff}.photo:active{filter:brightness(.97)}.photo svg{width:100%;height:100%;display:block}.photo .piclabel{position:absolute;bottom:4px;left:4px;border-radius:4px;background:#182437ac;color:#fff;font-size:9px;padding:2px 5px;line-height:1.3}.photo.placeholder .piclabel{background:#adb8c7}.divide{flex:none;width:1px;height:75px;background:#dfe5ec;margin-left:1px}.queue{width:44px;height:90px;flex:none;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;position:relative;overflow:hidden;border-radius:7px;border:1px solid #cfd7e3;background:#e9edf3;color:#344156;padding:0}.queue:disabled{cursor:default}.queue .fill{position:absolute;bottom:0;left:0;right:0;height:0%;background:var(--blue);transition:height .18s ease-out}.queue .ins{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;font-size:10px;font-weight:750;line-height:1.3;text-shadow:0 1px 1px #ffffff55}.queue.progress .ins,.queue.complete .ins{color:white;text-shadow:0 1px 3px #152452d0}.queue .symbol{font-size:19px;line-height:1.1}.queue:not(:disabled):hover{border-color:#6c8aff}.refs{display:flex;gap:7px;align-items:center;overflow:auto;flex:1;min-width:0;height:90px;scrollbar-width:thin;scrollbar-color:#d2daea transparent}.refs .photo{min-width:0}.prompt{background:#f5f7fa;border:1px solid #edf0f4;border-radius:7px;margin-top:7px;padding:8px 10px;display:block;width:100%;color:#626e80;text-align:left;line-height:1.6;font-size:11.5px;min-height:32px}.prompt:hover{background:#eaf0ff;border-color:#cad8fc}.prompt:active{background:#e1ebff}.prompt .clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.highlight{background:#fff0af;color:#323846;border-radius:2px;padding:0 1px}.none{color:#99a4b3;text-align:center;padding:70px 10px}.none strong{display:block;color:#677388;font-size:14px;margin-bottom:8px}.toast{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);background:#253448ee;color:#fff;border-radius:8px;font-size:11px;padding:9px 13px;box-shadow:0 7px 20px #2a365733;pointer-events:none;opacity:0;transition:opacity .15s;max-width:80%;text-align:center;z-index:10}.toast.show{opacity:1}.hidden-bar{position:absolute;left:36px;top:30px;z-index:5;background:white;border:1px solid #dce2eb;border-radius:9px;color:#3c5070;padding:12px 16px;box-shadow:0 6px 20px #22222219}.note{position:absolute;right:42px;top:28px;color:#8391a4;font-size:11px;max-width:300px;text-align:right}.legal{color:#a0aabb;font-size:10px;padding:9px 16px;border-top:1px solid #e7ebf1;flex:none;background:#fafbfc}
@media(max-width:1180px){.workspace{padding:25px}.target{width:340px;opacity:.7}}@media(max-width:850px){.panel{top:12px;bottom:12px;left:12px;width:calc(100vw - 24px)}.workspace{min-height:100vh;padding:20px}.target{width:100%;align-self:flex-end;opacity:.75;margin-bottom:0}.note{display:none}.hidden-bar{left:12px;top:12px}.title{max-width:40%}.project{max-width:25%}}
</style>
</head>
<body>
<div class="shell" id="shell">
  <div class="workspace" id="workspace">
    <div class="note">2560×1440 / 100% 与 125% 缩放适配目标 · 演示视图不代表真实 DPI</div>
    <div class="target"><h2>AI 创作输入框 <span style="font-size:11px;color:#96a0b0;font-weight:400">模拟工作区</span></h2><p>在左侧卡片点击提示词、图片或队列，内容将在这里模拟出现；不会真的上传到任何 AI 服务。</p><div class="editor"><div class="editor-title">输入内容 · 仅用于交互验收</div><div class="editor-content" id="inputLog"><div class="empty">等待从提示词面板调用素材…</div></div><div class="target-actions"><span id="logCount">已调用 0 项</span><button id="clearLog">清空模拟输入</button></div></div></div>
  </div>
  <button id="reopen" class="hidden-bar" style="display:none">✦ 呼出 Prompt Shelf</button>
  <section class="panel" id="panel" aria-label="提示词快捷调用面板">
    <header class="bar"><span class="logo">✦</span><span class="brand">Prompt Shelf</span><small>提示词速用</small><span class="bar-end"><kbd>Ctrl + Alt + 1</kbd><button class="x" id="close" title="关闭面板">×</button></span></header>
    <div class="controls"><label class="search-wrap"><span class="mag">⌕</span><input id="search" placeholder="搜索案例名称、提示词、项目、标签…" autocomplete="off"/><button id="clear" class="clear" title="清空关键词">×</button></label><div class="nav" id="nav"></div></div>
    <main class="list" id="list"></main>
    <div class="legal">演示模式 · 所有粘贴操作仅在右侧模拟 · 队列进度表示已触发的指令数量</div>
    <div class="toast" id="toast" role="status"></div>
  </section>
</div>
<script>
(()=>{
const raw=[
{id:1,title:'透明玻璃材质优化',project:'B5玻尿酸精华液',tags:['产品精修','商业CG'],prompt:'以原图为唯一构图参考，严格保持产品瓶身结构、拍摄角度、比例与标签设计不变，优化透明玻璃折射、液体通透度、反射高光与商业摄影质感。',kind:'bottle',result:true,refs:[1,1.5,.667,1.333],fav:true,used:100},
{id:2,title:'布偶猫与橘猫同框摄影',project:'宠物情绪喷雾',tags:['场景生成','宠物摄影'],prompt:'一只赛级布偶猫与一只橘猫同框，自然互动，毛发蓬松真实，浅灰白无缝影棚背景，干净高级的宠物商业摄影，比例准确，不增加道具。',kind:'cat',result:true,refs:[.75,1.5],fav:false,used:98},
{id:3,title:'建筑主视觉保构图换色',project:'红白医美科技',tags:['保构图换色','商业CG'],prompt:'严格保持建筑群数量、外轮廓、仰视透视、中轴构图与镜面倒影不变，仅迁移红白医美科技氛围；保持玻璃与金属原本的灰蓝固有色。',kind:'architecture',result:true,refs:[1.777,.5625,1],fav:true,used:95},
{id:4,title:'猫砂异味痛点场景',project:'宠物除臭香薰',tags:['痛点场景','宠物摄影'],prompt:'以真实猫砂盆和室内家居为主体，呈现猫砂异味困扰，场景极简，宠物自然出现，保留画面左上区域留白，不加入多余装饰。',kind:'cat',result:false,refs:[1.333,1,.75],fav:false,used:70},
{id:5,title:'通用产品高清精修',project:'通用提示词库',tags:['产品精修'],prompt:'对原始产品图进行商业级高清精修，严格保留构图、拍摄角度、产品比例、品牌标签与材质固有色，优化反射、真实阴影及细节，禁止变形与新增元素。',kind:'bottle',result:false,refs:[],fav:true,used:88},
{id:6,title:'红白医美双瓶主视觉',project:'宠物情绪喷雾',tags:['产品渲染','商业CG'],prompt:'两瓶喷雾保持既定位置与结构，红白医美科技氛围，透明红色亚克力低矮平台，白色洁净背景，控制反光与留白，保证标签清晰。',kind:'bottle',result:true,refs:[],fav:false,used:66},
{id:7,title:'三轮电动车野猫驱离',project:'宠物驱猫喷雾',tags:['场景生成','户外场景'],prompt:'真实三轮电动车在日间简洁户外环境中，几只野猫自然逃离，车辆结构准确，左上角留白，低机位中景、真实摄影与商业CG质感。',kind:'vehicle',result:true,refs:[1.333,1.5,1,.667],fav:false,used:87}
];
const groups=[['换色','色调迁移','配色替换'],['保构图','构图锁定','结构锁定'],['精修','高清精修','商业精修'],['扩图','画面扩展','外扩'],['去背','去背景','背景移除'],['产品渲染','商品渲染','商业CG']];
const state={tab:'all',category:'',query:'',selected:0,opened:true,queue:null,queueTimer:null,toastTimer:null,items:0};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const terms=()=>state.query.trim().split(/\s+/).filter(Boolean);
const expansions=t=>{let g=groups.find(a=>a.some(x=>x.toLowerCase()===t.toLowerCase()));return g||[t]};
const fields=r=>[{v:r.title,w:7},{v:r.prompt,w:7},{v:r.project,w:2},{v:r.tags.join(' '),w:2}];
function score(r){let q=terms();if(!q.length)return 1;let total=0;for(let term of q){let best=0;for(let f of fields(r)){if(f.v.toLowerCase().includes(term.toLowerCase()))best=Math.max(best,30+f.w*3+(f.v.toLowerCase()===term.toLowerCase()?12:0));else for(let alt of expansions(term)){if(alt!==term&&f.v.toLowerCase().includes(alt.toLowerCase()))best=Math.max(best,10+f.w)}}if(!best)return -1;total+=best}let full=state.query.trim().toLowerCase();if(r.title.toLowerCase().includes(full)||r.prompt.toLowerCase().includes(full))total+=15;return total}
function mark(s){let q=terms().flatMap(expansions).sort((a,b)=>b.length-a.length).filter(Boolean);if(!q.length)return esc(s);let re=new RegExp('('+[...new Set(q)].map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');return esc(s).replace(re,m=>'<mark class="highlight">'+m+'</mark>')}
function art(kind,idx){const palettes=[['#e8e2dc','#f9f7f3','#d4b9ae'],['#e1e9f3','#f8fbff','#a3bbd7'],['#eae6e0','#f9fcfb','#c4d1c6'],['#f7e2dc','#fff7f4','#df9c90'],['#d4e4e5','#f8fcfe','#91b5b9']];let [a,b,c]=palettes[(idx+5)%5];let shape='';if(kind==='cat'){shape=`<ellipse cx="63" cy="76" rx="43" ry="11" fill="#68798d" opacity=".12"/><path d="M30 72 Q23 57 32 44 L27 20 L46 29 Q60 24 71 29 L91 20 L85 47 Q92 60 83 74 Z" fill="#e4d0b7" stroke="#baa990" stroke-width="2"/><path d="M40 37 Q60 31 75 37" fill="none" stroke="#fff5e8" stroke-width="7"/><circle cx="47" cy="54" r="3.5" fill="#577fa0"/><circle cx="70" cy="54" r="3.5" fill="#577fa0"/><path d="M56 63 l5 0 l-3 4z" fill="#9c716d"/><path d="M33 74 Q18 76 17 61" fill="none" stroke="#d2b99f" stroke-width="9" stroke-linecap="round"/>`}
else if(kind==='architecture'){shape=`<rect x="23" y="27" width="26" height="72" rx="1" fill="#7294a9"/><rect x="58" y="8" width="33" height="91" rx="1" fill="#819caf"/><path d="M25 37h22M25 49h22M25 61h22M25 73h22M25 85h22M60 21h29M60 34h29M60 47h29M60 60h29M60 73h29M60 86h29" stroke="#dce7ea" stroke-width="2"/><path d="M23 99h67" stroke="#5e8198" stroke-width="4"/>`}
else if(kind==='vehicle'){shape=`<circle cx="32" cy="79" r="13" fill="#303b49"/><circle cx="90" cy="79" r="13" fill="#303b49"/><circle cx="32" cy="79" r="6" fill="#d6dce2"/><circle cx="90" cy="79" r="6" fill="#d6dce2"/><path d="M29 70 L48 47 L80 47 L96 70Z" fill="#789a9b" stroke="#496777" stroke-width="3"/><path d="M39 44 L40 29 L70 29 L81 45" fill="none" stroke="#607c89" stroke-width="4"/><path d="M50 48 V65" stroke="#d0dddb" stroke-width="3"/>`}
else{shape=`<ellipse cx="60" cy="83" rx="36" ry="7" fill="#526376" opacity=".15"/><rect x="29" y="77" width="64" height="8" rx="2" fill="${c}"/><rect x="47" y="21" width="27" height="56" rx="6" fill="#f8fdff" opacity=".72" stroke="#94aebb" stroke-width="2"/><rect x="50" y="15" width="21" height="11" rx="2" fill="#546a79"/><rect x="49" y="42" width="24" height="18" rx="1" fill="#f7f0e6" stroke="#d5c7b8"/><path d="M53 30 V74" stroke="white" opacity=".7" stroke-width="4"/>`}
return `<svg viewBox="0 0 120 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="g${kind}${idx}" x1="0" x2="1" y1="0" y2="1"><stop stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="120" height="100" fill="url(#g${kind}${idx})"/><circle cx="111" cy="-8" r="64" fill="#fff" opacity=".32"/>${shape}</svg>`}
function photo(kind,idx,width,label,action,extra=''){return `<button class="photo ${extra}" style="width:${width}px" aria-label="${esc(label)}，单击模拟粘贴" title="${esc(label)} · 点击模拟粘贴" data-${action}="1">${art(kind,idx)}<span class="piclabel">${esc(label)}</span></button>`}
function row(r){let img='';if(r.result||r.refs.length){img=`<div class="imgline">${r.result?photo(r.kind,r.id,90,'效果图',`photo-result-${r.id}`,'result'):`<div class="photo result placeholder" style="width:90px;display:grid;place-items:center">▧<span class="piclabel">暂无效果</span></div>`}${r.refs.length?`<div class="divide"></div><button class="queue" data-queue="${r.id}" aria-label="顺序粘贴 ${r.refs.length} 张参考图"><span class="fill" id="fill-${r.id}"></span><span class="ins"><span class="symbol" id="symbol-${r.id}">⇧</span><span id="qtext-${r.id}">顺序<br>粘贴</span><span id="qn-${r.id}">${r.refs.length}张</span></span></button><div class="refs">${r.refs.map((ratio,i)=>photo(r.kind,r.id+i+1,Math.round(Math.max(2/3,Math.min(1.5,ratio))*90),`参考 ${i+1}`,`photo-ref-${r.id}-${i}`)).join('')}</div>`:''}</div>`}
return `<article class="case" data-case="${r.id}" tabindex="-1"><div class="casehead"><span class="title" title="${esc(r.title)}">${mark(r.title)}</span><span class="project" title="${esc(r.project)}">· ${mark(r.project)}</span>${r.tags.slice(0,3).map(x=>`<span class="tag">${mark(x)}</span>`).join('')}<button class="star ${r.fav?'on':''}" aria-label="${r.fav?'取消收藏':'添加收藏'}" data-fav="${r.id}">${r.fav?'★':'☆'}</button></div>${img}<button class="prompt" title="点击模拟粘贴完整提示词" data-prompt="${r.id}"><span class="clamp">${mark(r.prompt)}</span></button></article>`}
function filtered(){let arr=raw.filter(r=>state.tab==='fav'?r.fav:true);if(state.category)arr=arr.filter(r=>r.tags.includes(state.category));arr=arr.map(r=>({r,s:score(r)})).filter(x=>x.s>=0);arr.sort((a,b)=>state.query.trim()?b.s-a.s||b.r.used-a.r.used:state.tab==='recent'?b.r.used-a.r.used:b.r.used-a.r.used);return arr.map(x=>x.r)}
function render(){const items=filtered();const nav=$('nav');nav.innerHTML=[['all','全部案例'],['recent','最近使用'],['fav','我的收藏']].map(([id,name])=>`<button class="tab ${state.tab===id?'active':''}" data-tab="${id}">${name}</button>`).join('')+'<span class="line"></span>'+['产品精修','场景生成','保构图换色'].map(cat=>`<button class="category ${state.category===cat?'active':''}" data-cat="${cat}">${cat}</button>`).join('')+`<span class="count">${items.length} 条</span>`;$('list').innerHTML=items.map(row).join('')||'<div class="none"><strong>没有找到匹配的案例</strong>可以尝试减少关键词，或切换至“全部案例”。</div>';
if(items.length){state.selected=Math.max(0,Math.min(state.selected,items.length-1));const target=$('list').querySelector(`[data-case="${items[state.selected].id}"]`);target?.classList.add('selected')}
if(state.queue)queueUI()}
function queueUI(){if(!state.queue)return;const{id,done,total,active}=state.queue;const b=$('list').querySelector(`[data-queue="${id}"]`);if(!b)return;const f=b.querySelector('.fill');f.style.height=`${done/total*100}%`;b.classList.toggle('progress',active);b.classList.toggle('complete',done===total);b.disabled=active;b.querySelector('.symbol').textContent=done===total?'✓':active?'⇧':'⇧';b.querySelector('[id^="qtext-"]').innerHTML=done===total?'队列<br>完成':active?'正在<br>粘贴':'顺序<br>粘贴';b.querySelector('[id^="qn-"]').textContent=`${done}/${total}`}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>t.classList.remove('show'),1600)}
function addLog(type,msg){let el=$('inputLog');if(!state.items)el.innerHTML='';state.items++;let node=document.createElement('div');node.className='insert';node.innerHTML=`<b>${esc(type)}</b><span>${esc(msg)}</span>`;el.appendChild(node);el.scrollTop=el.scrollHeight;$('logCount').textContent=`已调用 ${state.items} 项`}
function call(r,kind,label){if(state.queue?.active){toast('队列执行中，请等待或按 Esc 取消');return}addLog(kind,label);r.used=Date.now();toast(`${kind}已添加至模拟输入区 · 面板保持开启`)}
function resetQueue(){clearTimeout(state.queueTimer);state.queue=null;render()}
function startQueue(r){if(state.queue?.active){toast('队列正在执行，避免重复启动');return}if(!r.refs.length)return;state.queue={id:r.id,total:r.refs.length,done:0,active:true};queueUI();toast(`模拟顺序粘贴 ${r.refs.length} 张参考图`);function next(){if(!state.queue?.active||state.queue.id!==r.id)return;let q=state.queue;q.done++;addLog('参考图',`${r.title} · 参考 ${q.done}`);queueUI();if(q.done<q.total){state.queueTimer=setTimeout(next,520)}else{q.active=false;r.used=Date.now();queueUI();toast(`队列已执行 ${q.total}/${q.total}`);state.queueTimer=setTimeout(resetQueue,1800)}}state.queueTimer=setTimeout(next,490)}
function cancel(){if(!state.queue?.active)return false;clearTimeout(state.queueTimer);let q=state.queue;q.active=false;queueUI();toast(`已停止队列：已触发 ${q.done}/${q.total} 次，剩余未执行`);state.queueTimer=setTimeout(resetQueue,2000);return true}
function closePanel(){if(state.queue?.active){toast('队列执行中：先按 Esc 停止后再关闭');return}state.opened=false;state.query='';$('search').value='';$('panel').classList.add('is-hidden');$('reopen').style.display='block'}
function openPanel(tab='all'){state.opened=true;state.tab=tab;state.category='';state.query='';state.selected=0;$('search').value='';$('panel').classList.remove('is-hidden');$('reopen').style.display='none';render();$('search').focus()}
$('list').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.fav){let r=raw.find(x=>x.id==Number(b.dataset.fav));r.fav=!r.fav;render();toast(r.fav?'已收藏':'已取消收藏');return}if(b.dataset.prompt){let r=raw.find(x=>x.id==Number(b.dataset.prompt));call(r,'提示词',r.prompt);return}if(b.dataset.queue){startQueue(raw.find(x=>x.id==Number(b.dataset.queue)));return}for(let key of Object.keys(b.dataset)){if(key.startsWith('photoResult')){let id=Number(key.slice("photoResult-".length));let r=raw.find(x=>x.id===id);if(r)call(r,'效果图',r.title);return}if(key.startsWith('photoRef')){let nums=key.slice("photoRef-".length).split('-');let id=Number(nums[0]),index=Number(nums[1]);let r=raw.find(x=>x.id===id);if(r)call(r,'参考图',`${r.title} · 参考 ${index+1}`);return}}});
$('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){state.tab=b.dataset.tab;state.selected=0;render()}if(b.dataset.cat){state.category=state.category===b.dataset.cat?'':b.dataset.cat;state.selected=0;render()}});
$('search').addEventListener('input',e=>{state.query=e.target.value;state.selected=0;render()});$('clear').addEventListener('click',()=>{$('search').value='';state.query='';state.selected=0;render();$('search').focus()});$('close').addEventListener('click',closePanel);$('reopen').addEventListener('click',()=>openPanel());$('clearLog').addEventListener('click',()=>{state.items=0;$('inputLog').innerHTML='<div class="empty">等待从提示词面板调用素材…</div>';$('logCount').textContent='已调用 0 项'});
$('workspace').addEventListener('click',()=>{if(state.opened)closePanel()});
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.altKey&&['1','2','3'].includes(e.key)){e.preventDefault();openPanel(({1:'all',2:'recent',3:'fav'})[e.key]);return}if(!state.opened)return;if(e.key==='Escape'){e.preventDefault();if(!cancel())closePanel();return}if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(document.activeElement===$('search')){let items=filtered();state.selected=Math.max(0,Math.min(items.length-1,state.selected+(e.key==='ArrowDown'?1:-1)));render();let node=$('list').querySelector('.case.selected');node?.scrollIntoView({block:'nearest'});e.preventDefault()}return}if(e.key==='Enter'&&document.activeElement===$('search')){let r=filtered()[state.selected];if(r){e.preventDefault();call(r,'提示词',r.prompt)}return}if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();$('search').focus();$('search').select()}});
render();$('search').focus();
})();
</script>
</body></html>
