/* V4/V4.1: normal grid equalizes entire rows; masonry maintains independent column heights. */
.gallery.regular .case{height:100%}
.gallery.regular .case .prompt{flex-grow:1}
.gallery.regular .case.editing .edit-prompt{flex:1 1 auto}
.gallery.masonry .case{height:auto}
.gallery.masonry .case .prompt{flex:none}
.gallery.masonry .case .edit-prompt{flex:none}
.gallery.masonry .casefoot{margin-top:6px}
@media(max-width:680px){.headrow{flex-wrap:wrap}.head-controls{margin-left:auto}.view-toggle button{padding:5px 6px}.tag-row .taglink{font-size:11px}}

/* V4.1: subtle state indicators; no expand/collapse glyphs. */
.navitem.project-navigation.active{background:#eff3fc;color:#5879c4;box-shadow:inset 2px 0 0 rgba(36,91,255,.33)}
.navitem.project-navigation:not(.active):hover{background:#f1f5fa}
.sectiontitle{border-radius:5px;padding:4px 8px 4px 9px;position:relative;margin-left:-2px;transition:background .12s,color .12s}
.sectiontitle.expanded{background:rgba(36,91,255,.065);color:#5474b7}
.sectiontitle.expanded::before{content:"";position:absolute;left:2px;top:7px;bottom:7px;width:2px;border-radius:3px;background:rgba(36,91,255,.38)}
/* V4.1: one consistent low-visibility scrollbar treatment on every scrollable region. */
html,body,.rail-inner,.secondary-list,.scrollarea,.ref-strip,.quickbar,.project-inline-list,*{scrollbar-width:thin;scrollbar-color:rgba(99,119,151,.11) transparent}
:is(.rail-inner,.secondary-list,.scrollarea,.ref-strip,.quickbar,.project-inline-list):hover{scrollbar-color:rgba(99,119,151,.32) transparent}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(99,119,151,.11);border-radius:12px}
:is(.rail-inner,.secondary-list,.scrollarea,.ref-strip,.quickbar,.project-inline-list):hover::-webkit-scrollbar-thumb{background:rgba(99,119,151,.30)}
::-webkit-scrollbar-thumb:hover{background:rgba(99,119,151,.49)!important}
/* V4.1: splitter retains wide hitbox while its visible trace is near-transparent. */
.splitter{background:rgba(134,157,192,.018);transition:background .12s}
.splitter::after{left:2px;width:2px;height:34px;border-radius:3px;background:rgba(97,121,157,.12);transition:background .12s}
.splitter:hover{background:rgba(126,151,190,.055)}
.splitter:hover::after{background:rgba(97,121,157,.42)}
.splitter.dragging{background:rgba(36,91,255,.075)}
.splitter.dragging::after{background:rgba(36,91,255,.52)}
/* V4.1: avoid dark scrollbar edges on the horizontal image strip. */
.ref-strip{scrollbar-gutter:auto}

/* V4.2 · 三层导航背景，仅加极轻的灰度，主资料库仍为原有纯白 */
.rail{background:#f1f4f8}
.secondary{background:#f8fafc}
.secondary-head{background:#f8fafc;border-bottom-color:#e8edf5}
.secondary-list{background:#f8fafc}
.second-search,.second-search input{background:#fff}
.splitter{background:rgba(139,158,187,.035)}
/* V4.2 · 标签入口：完整 38px 导航热区，与“全部 / 收藏 / 最近 / 项目归档”一致 */
.navitem.tag-navigation{height:38px;width:100%;display:flex;align-items:center;justify-content:flex-start;margin:2px 0 6px;padding:0 11px;font-size:13px;font-weight:630}
.navitem.tag-navigation.active{background:#e6edfb;color:#315dcb;box-shadow:inset 2px 0 0 rgba(36,91,255,.26)}
.navitem.tag-navigation .tag-nav-hint{margin-left:auto;font-size:10px;color:#a0acbd;font-weight:500}
.navitem.tag-navigation.active .tag-nav-hint{color:#8297bc}
/* V4.2 · 链接在铅笔左侧，来源为空时保持占位但不可点击 */
.source-link{display:grid;place-items:center;text-decoration:none;cursor:pointer}
.source-link svg{display:block;pointer-events:none}
.source-link:not(.unavailable):hover{background:#edf3ff;color:#245bff}
.source-link.unavailable{cursor:default;color:#cbd3de;opacity:.72}
.source-editor{display:flex;align-items:center;gap:8px;margin-top:9px;min-width:0;flex-wrap:wrap}
.source-editor label{font-size:10.5px;font-weight:670;color:#72829b;white-space:nowrap}
.source-editor input{flex:1 1 210px;min-width:110px;height:33px;border:1px solid #dce6f2;background:#fff;border-radius:7px;padding:0 10px;font-size:11px}

media=function(r){

 if(!html)return html;

 // old markup closes the strip and the media in its last two closing tags
 const tail='</div></div>';

function updateOneCarousel(carousel,restorePosition=false){
 const vp=carousel.querySelector('.ref-viewport');
 const track=carousel.querySelector('.ref-strip');
 if(!vp||!track)return;
 const items=[...track.children];
 const max=Math.max(0,vp.scrollWidth-vp.clientWidth);
 const owner=Number(carousel.dataset.carousel);
 if(restorePosition){
  const index=Math.min(refPositionByCard.get(owner)||0,Math.max(0,items.length-1));
  const desired=items[index]?items[index].offsetLeft-items[0].offsetLeft:0;
  vp.scrollLeft=Math.min(max,desired);
 }
 carousel.querySelector('.ref-edge.prev')?.classList.toggle('available',vp.scrollLeft>1.5);
 carousel.querySelector('.ref-edge.next')?.classList.toggle('available',max-vp.scrollLeft>1.5);
}

function shiftReference(carousel,direction){
 const vp=carousel?.querySelector('.ref-viewport');const track=carousel?.querySelector('.ref-strip');
 if(!vp||!track)return;
 const items=[...track.children];if(!items.length)return;
 const max=Math.max(0,vp.scrollWidth-vp.clientWidth);const current=vp.scrollLeft;
 const pos=items.map(n=>n.offsetLeft-items[0].offsetLeft);
 let index=direction==='next'?pos.findIndex(v=>v>current+2):-1;
 if(direction==='prev'){for(let i=0;i<pos.length;i++){if(pos[i]<current-2)index=i;else break}}
 let target=direction==='next'?(index<0?max:Math.min(max,pos[index])):(index<0?0:Math.max(0,pos[index]));
 const nextIndex=pos.findIndex(v=>Math.abs(v-target)<3);
 refPositionByCard.set(Number(carousel.dataset.carousel),nextIndex>=0?nextIndex:Math.max(0,index));
 vp.scrollTo({left:target,behavior:'smooth'});
}

 const shade=document.createElement('div');shade.className='v50-shade';shade.setAttribute('role','presentation');
 const modal=document.createElement('section');modal.className='v50-modal';modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');modal.setAttribute('aria-label',title);
 modal.innerHTML='<h3>'+esc(title)+'</h3><p>'+desc+'</p>'+content+'<div class="v50-actions"></div>';
 const actionsEl=modal.querySelector('.v50-actions');
 actions.forEach(o=>{const b=document.createElement('button');b.className='btn'+(o.primary?' primary':'')+(o.secondary?'':'');b.type='button';b.textContent=o.label;b.onclick=()=>{if(!o.stay)shade.remove();o.action?.()};actionsEl.appendChild(b)});
 shade.appendChild(modal);document.body.appendChild(shade);return {shade,modal};
}
function v50DraftRecovery(){
 const saved=v50Stored();if(!saved||!saved.record)return;
 const d=saved.record;
 v50Popup('发现未完成的案例草稿','这是意外退出后的草稿保护演示。恢复仅继续编辑，不会覆盖正式案例。',
  `<div class="v50-summary"><b>${esc(d.title||'未命名案例')}</b><div>提示词：${esc(String(d.prompt||'').slice(0,135))||'（尚未填写）'}</div><div>参考图 ${d.refs?.length||0} 张 · 效果图 ${d.result?'1':'0'} 张</div><span class="v50-muted">暂存于 ${esc(new Date(saved.savedAt).toLocaleString('zh-CN'))}</span></div>`,
  [{label:'放弃草稿',action:()=>{v50WipeDraft();showToast('草稿已放弃，正式内容未变')}},{label:'恢复并继续编辑',primary:true,action:()=>{
   v50Restoring=true;const d=JSON.parse(JSON.stringify(saved.record));
   let r=records.find(x=>x.id===saved.id);
   if(!r){r={...d,id:saved.id,title:d.title||'新建案例草稿',prompt:'',refs:[],result:null};records.unshift(r)}
   editing=saved.id;creatingId=saved.isNew?saved.id:null;draft=d;
   v50Baseline=saved.origin||v50JSON(r);
   view='all';query='';activeTag='';activeProject='';expanded='';
   render(false);resetPasteTarget();v50Restoring=false;
   document.querySelector('#case-'+editing)?.scrollIntoView({block:'nearest'});
   showToast('已恢复未提交草稿，请确认后点击保存案例');
  }}]);
}
// Browser draft protection: formal desktop version will use transaction-safe disk snapshots.
const v50StartEditOld=startEdit;
startEdit=function(id){v50StartEditOld(id);if(editing===id&&draft){v50Baseline=v50JSON(draft)}};
const v50CancelOld=cancel;
function v50Discard(){v50WipeDraft();v50CancelOld();showToast('已放弃未保存的修改')}
cancel=function(){
 if(!v50Changed()){v50WipeDraft();v50CancelOld();return}
 v50Popup('放弃这次修改？','你修改的提示词、图片和其他字段尚未正式保存。可以保留编辑状态，也可以放弃。',
  '<div class="v50-warning">放弃后会恢复上次保存的案例内容。自动保护的草稿也会一并清除。</div>',
  [{label:'继续编辑',action:()=>{}},{label:'放弃修改',primary:true,action:v50Discard}]);
};
const v50CommitOld=commit;
commit=function(){const id=editing;v50CommitOld();if(id!==null&&editing===null){v50WipeDraft();v50DraftNoticeGiven=false}};
const v50PaintOld=paintCards;
paintCards=function(preserve=true){v50PaintOld(preserve);if(editing!==null&&draft){const status=document.querySelector('#case-'+editing+' .edit-bottom .fieldnote');if(status){status.innerHTML='<span class="v50-draft-status"><i></i>未正式保存 · 自动保护草稿</span>'}}};
// Only protects attempts to switch list view; does not change the existing UI navigation behavior.
const v50SetFilterOld=setFilter;
setFilter=function(type,value){
 if(v50Changed()){
  v50Popup('当前案例尚未保存','切换列表之前，要如何处理现在的修改？',
   '<div class="v50-summary">可以先返回编辑，或放弃修改后继续切换。保存案例请使用卡片内的“保存案例”按钮。</div>',
   [{label:'返回编辑',action:()=>{}},{label:'放弃并切换',primary:true,action:()=>{v50Discard();v50SetFilterOld(type,value)}}]);
  return;
 }
 v50SetFilterOld(type,value);
};
document.addEventListener('input',e=>{if(e.target.closest?.('[data-edit-field]'))setTimeout(v50SafeStash,0)},true);
document.addEventListener('change',e=>{if(e.target.closest?.('[data-edit-field]'))setTimeout(v50SafeStash,0)},true);
const v50PaintForImages=paintCards;
paintCards=function(preserve=true){v50PaintForImages(preserve);if(editing!==null&&draft)setTimeout(v50SafeStash,0)};
window.addEventListener('beforeunload',e=>{if(v50Changed()){v50SafeStash();e.preventDefault();e.returnValue=''}});

// Shared image identity is stable across cases. Recycling preserves all references.
const v50SharedAsset='asset-shared-sample-001';
const v50SameImage='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><rect width="160" height="160" fill="#e6f0f6"/><ellipse cx="80" cy="133" rx="47" ry="10" fill="#c4d5df"/><rect x="57" y="39" width="46" height="91" rx="7" fill="#f8fcff" stroke="#7898ad" stroke-width="3"/><rect x="67" y="29" width="26" height="13" rx="3" fill="#718da0"/><rect x="66" y="75" width="28" height="25" rx="1" fill="#dfeaf0"/><path d="M62 44v75" stroke="#fff" stroke-width="6" opacity=".8"/></svg>');
// Two sample cases share the same original image reference to demonstrate safe cleanup.
if(records[0]?.refs?.[0]&&records[1]?.refs?.[0]){for(const r of [records[0],records[1]]){r.refs[0].assetId=v50SharedAsset;r.refs[0].image=v50SameImage;r.refs[0].aspect=1}}
function v50Assets(rec){return [rec.result,...(rec.refs||[])].filter(Boolean).map(p=>p.assetId||p.id)}
function v50CountRefs(key){return [...records,...trashRecords].reduce((n,r)=>n+v50Assets(r).filter(x=>x===key).length,0)}
function v50SharedRefs(rec){return new Set(v50Assets(rec).filter(id=>v50CountRefs(id)>1)).size}
const v50CardOld=card;
card=function(r){
 if(view!=='trash')return v50CardOld(r);
 const img=(p,isResult)=>{
  const preview=p.image?`<img src="${esc(p.image)}"/>`:art(r.kind,isResult?0:1);
  return `<div class="tr-pic ${isResult?'result':''}" title="${isResult?'生成效果图':'参考图'}">${preview}</div>`;
 };
 const pics=[...(r.result?[img(r.result,true)]:[]),...(r.refs||[]).slice(0,r.result?2:3).map(p=>img(p,false))];
 const remain=(r.refs?.length||0)+(r.result?1:0)-pics.length;
 const shared=v50SharedRefs(r);
 return `<article class="case trashcase" data-card="${r.id}">
  <div class="tr-head"><div style="min-width:0;flex:1"><div class="tr-title" title="${esc(r.title)}">${esc(r.title)}</div><div class="tr-project">原项目：${esc(r.project||'独立案例')} · ${r.refs?.length||0} 张参考图</div></div>
  <div class="tr-pics">${pics.join('')}${remain>0?`<span class="tr-more">+${remain}</span>`:''}</div></div>
  <div class="tr-text" title="${esc(r.prompt)}">${esc(r.prompt||'暂无提示词内容')}</div>
  <div class="tr-foot"><span class="tr-shared">${shared?'其中 '+shared+' 张图片仍被其他案例使用':'原始图片暂保留'}</span><div class="tr-buttons"><button class="btn sm" data-restore="${r.id}">${uiIcon('restore',14)} 恢复</button><button class="quiet-delete" data-permanent="${r.id}">${uiIcon('trash',13)} 永久删除</button></div></div>
 </article>`;
};
function v50RestoreCase(id){const r=trashRecords.find(x=>x.id===id);if(!r)return;trashRecords=trashRecords.filter(x=>x.id!==id);if(r.project&&!projectNames.includes(r.project))r.project='';records.unshift(r);view='trash';rebuild();showToast('案例恢复成功，提示词和图片关联完整保留')}
function v50PermanentCase(id){
 const r=trashRecords.find(x=>x.id===id);if(!r)return;
 const keys=[...new Set(v50Assets(r))];
 if(!confirm('永久删除案例「'+r.title+'」？此操作不可撤销。仍被其他案例复用的原图不会被清除。'))return;
 trashRecords=trashRecords.filter(x=>x.id!==id);
 const freed=keys.filter(x=>v50CountRefs(x)===0).length;
 const kept=keys.length-freed;
 // In this prototype images are embedded in records. No externally stored file is actually removed.
 rebuild();
 showToast('已永久删除案例；'+kept+' 个共享原图引用保留，'+freed+' 个无引用资源可清理（演示）');
}
const v50DestroyOld=destroyCase;
destroyCase=function(id){const r=records.find(x=>x.id===id);if(r){r.deletedAt=Date.now();v50WipeDraft()}v50DestroyOld(id)};
const v50LibraryOld=library;
library=function(){let h=v50LibraryOld();if(view==='trash'){
 h=h.replace('>我的素材资料库</div>','>回收站</div>');
 h=h.replace('图文直览 · 原卡片内编辑 · 网格与瀑布流自由切换','完整保留提示词与关联图片 · 恢复或永久删除');
 h=h.replace('搜索案例标题、提示词正文、项目、标签…','搜索已删除案例');
 }return h};
const v50RenderOld=render;
render=function(preserve=true){v50RenderOld(preserve);document.querySelector('.workspace')?.classList.toggle('trash-view',view==='trash');if(view==='trash')document.querySelector('#countOutput')?.replaceChildren(document.createTextNode(trashRecords.length+' 个已删除案例'))};
// Place draft recovery after initial render. Simulate unexpected closure using an isolated demo-only action.
document.querySelector('#simulateCrash')?.addEventListener('click',()=>{
 if(editing===null){showToast('请先编辑一张案例并修改内容，再模拟中断');return}
 v50SafeStash();if(!v50Changed()){showToast('尚无待保护的修改，请先输入内容');return}
 editing=null;draft=null;creatingId=null;render(false);
 showToast('已模拟意外中断。接下来可以选择恢复或放弃草稿');
 v50DraftRecovery();
});

// Demo backup: single self-contained JSON with original image bytes; production can package it as a ZIP.
const V50_BACKUP_VERSION=1;
function v50BuildBackup(){
 return {format:'prompt-shelf-backup',version:V50_BACKUP_VERSION,createdAt:new Date().toISOString(),
 data:{records:JSON.parse(JSON.stringify(records)),trashRecords:JSON.parse(JSON.stringify(trashRecords)),tags:JSON.parse(JSON.stringify(tagCatalog)),projects:[...projectNames],tagOrder:[...tagOrder],synonym,preferences:{sortBy,layoutMode,navSize,secondSize}}};
}
function v50BackupSummary(data){const d=data?.data||{};return `<div class="v50-list"><div><strong>${d.records?.length||0}</strong><span>正常案例</span></div><div><strong>${d.trashRecords?.length||0}</strong><span>回收站案例</span></div><div><strong>${d.tags?.length||0}</strong><span>标签</span></div><div><strong>${d.projects?.length||0}</strong><span>项目</span></div></div>`}
function v50ExportBackup(){const data=v50BuildBackup(),raw=JSON.stringify(data);const blob=new Blob([raw],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='PromptShelf_完整备份_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),8000);showToast('已生成包含图文、归档、回收站与设置的 JSON 演示备份')}
function v50OpenBackup(){
 v50Popup('备份与恢复','建议定期导出一份完整素材库副本，妥善保存到其他磁盘或电脑。',
 v50BackupSummary(v50BuildBackup())+'<div class="v50-summary">完整备份包含：案例提示词、来源链接、效果图与参考图原始数据、项目、标签、快捷标签排序、回收站及必要设置。</div><div class="v50-warning">本浏览器 Demo 使用自包含 JSON 演示导出与恢复；正式桌面产品将采用可校验的完整备份包，并在恢复前进行完整性检查。</div>',
 [{label:'暂不操作',action:()=>{}},{label:'从备份恢复…',action:()=>document.querySelector('#restoreBackupInput')?.click()},{label:'导出完整备份',primary:true,action:v50ExportBackup}]);
}
function v50ValidateBackup(obj){if(obj?.format!=='prompt-shelf-backup'||obj.version!==1)return false;const d=obj.data;if(!d||!Array.isArray(d.records)||!Array.isArray(d.trashRecords)||!Array.isArray(d.tags)||!Array.isArray(d.projects)||!Array.isArray(d.tagOrder))return false;return d.records.every(r=>Number.isSafeInteger(r.id)&&typeof r.title==='string'&&Array.isArray(r.refs)&&typeof r.prompt==='string')&&d.trashRecords.every(r=>Number.isSafeInteger(r.id)&&Array.isArray(r.refs))}
let v50PendingImport=null;
document.querySelector('#restoreBackupInput')?.addEventListener('change',async e=>{
 const file=e.target.files?.[0];e.target.value='';if(!file)return;
 try{if(file.size>160*1024*1024)throw Error('演示文件过大');const obj=JSON.parse(await file.text());if(!v50ValidateBackup(obj))throw Error('备份格式或必要字段不完整');v50PendingImport=obj;
  v50Popup('确认恢复这份完整备份？','先查看备份内容数量，确认后才会替换当前演示资料库。',
    `<div class="v50-summary"><b>备份日期：</b>${esc(obj.createdAt||'未知')}<br><b>文件：</b>${esc(file.name)}</div>`+v50BackupSummary(obj)+'<div class="v50-warning">这是整体恢复，不是合并：当前演示资料库将被替换。建议先导出当前备份。</div>',
    [{label:'取消恢复',action:()=>{v50PendingImport=null}},{label:'确认整体恢复',primary:true,action:()=>v50ApplyBackup(obj)}]);
 }catch(err){v50Popup('备份无法读取','文件格式无效或缺少必要数据。当前资料库没有被修改。',`<div class="v50-warning">${esc(err.message)}</div>`,[{label:'关闭',primary:true}])}
});
function v50ApplyBackup(obj){if(!v50ValidateBackup(obj)){showToast('恢复失败：备份无效');return}
 const d=obj.data;
 records=JSON.parse(JSON.stringify(d.records));trashRecords=JSON.parse(JSON.stringify(d.trashRecords));
 tagCatalog.splice(0,tagCatalog.length,...JSON.parse(JSON.stringify(d.tags)));
 projectNames.splice(0,projectNames.length,...d.projects);
 tagOrder=[...d.tagOrder];
 sortBy=d.preferences?.sortBy||'recent';layoutMode=d.preferences?.layoutMode||'regular';
 navSize=Math.max(172,Math.min(340,Number(d.preferences?.navSize)||224));
 secondSize=Math.max(278,Math.min(680,Number(d.preferences?.secondSize)||320));
 editing=null;draft=null;creatingId=null;pasteTarget=null;expanded='';view='all';query='';activeTag='';activeProject='';
 v50WipeDraft();render(false);rebuild();showToast('完整备份已恢复到当前演示会话（刷新页面将恢复初始样例）');
}
document.querySelector('#backupManager')?.addEventListener('click',e=>{if(editing!==null){showToast('请先保存或取消当前编辑再备份');return}v50OpenBackup()});
// Initial V4.11 seed remains the baseline; only enhanced UI and safety workflows are added.
render(false);
setTimeout(v50DraftRecovery,250);

</script></body></html>
