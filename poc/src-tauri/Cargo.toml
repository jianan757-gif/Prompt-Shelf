[package]
name = "prompt-shelf-poc"
version = "0.1.0"
edition = "2021"
default-run = "prompt-shelf-poc"
description = "Prompt Shelf local library"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "rt", "macros"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
sha2 = "0.10"
dunce = "1"
rusqlite = { version = "=0.41.0", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
fs2 = "=0.4.3"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-dialog = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Shell"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
